<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DayPulse — Your Daily World Briefing, Observances, Weather &amp; News Wire</title>
  <meta name="description" content="Start your morning with DayPulse: local weather, sunset and moon phase, world observances, music history milestones, notable birthdays, word &amp; quote of the day, daily trivia, and a 4-source global news wire." />
  <link rel="canonical" href="https://daypulse.live/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f8f7f4;
      --surface: #ffffff;
      --surface-alt: #f1efe9;
      --text: #16181d;
      --text-muted: #5a606d;
      --border: #e3dfd5;
      --accent: #1d4ed8;
      --accent-soft: #eff4ff;
      --live-red: #dc2626;
      --live-glow: rgba(220, 38, 38, 0.35);
      --gold: #b45309;
      --gold-soft: #fef3c7;
      --green: #15803d;
      --green-soft: #dcfce7;
      --red: #b91c1c;
      --red-soft: #fee2e2;
      --shadow: 0 2px 10px rgba(22, 24, 29, 0.04);
      --radius: 14px;
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --surface: #171a21;
      --surface-alt: #20242e;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2a2f3b;
      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --live-red: #f87171;
      --live-glow: rgba(248, 113, 113, 0.45);
      --gold: #fbbf24;
      --gold-soft: rgba(251, 191, 36, 0.14);
      --green: #4ade80;
      --green-soft: rgba(74, 222, 128, 0.14);
      --red: #f87171;
      --red-soft: rgba(248, 113, 113, 0.14);
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, .serif {
      font-family: 'Newsreader', Georgia, serif;
    }

    a { color: inherit; text-decoration: none; }

    .utility-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .utility-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.875rem;
    }

    .utility-metrics {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    .city-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.84rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .city-btn:hover { border-color: var(--accent); }

    .metric-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .metric-pill strong { color: var(--text); font-weight: 600; }

    .utility-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn:hover { border-color: var(--accent); }

    .container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .masthead {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 22px;
      border-bottom: 2px solid var(--text);
      margin-bottom: 28px;
    }

    .brand-title {
      font-size: clamp(2.1rem, 4vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.05;
      display: inline-flex;
      align-items: baseline;
    }

    @keyframes liveTextPulse {
      0%, 100% {
        opacity: 1;
        text-shadow: 0 0 12px var(--live-glow);
      }
      50% {
        opacity: 0.42;
        text-shadow: none;
      }
    }

    @keyframes liveBeaconPulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--live-glow);
      }
      50% {
        opacity: 0.35;
        transform: scale(0.82);
        box-shadow: 0 0 0 5px rgba(220, 38, 38, 0);
      }
    }

    .brand-live {
      color: var(--live-red);
      display: inline-flex;
      align-items: center;
      animation: liveTextPulse 2.1s ease-in-out infinite;
    }

    .live-beacon {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--live-red);
      display: inline-block;
      margin-left: 6px;
      align-self: center;
      animation: liveBeaconPulse 2.1s ease-in-out infinite;
    }

    .brand-sub {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .day-switcher-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }

    .active-date-label {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .day-toggle {
      display: inline-flex;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
    }

    .day-toggle button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 6px 16px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .day-toggle button.active {
      background: var(--surface);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .day-toggle button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
      margin-bottom: 28px;
    }

    @media (max-width: 980px) {
      .grid-3 { grid-template-columns: 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .day-switcher-wrap { align-items: flex-start; }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .card-kicker {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 14px;
      line-height: 1.25;
    }

    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .item-list li {
      padding-bottom: 13px;
      border-bottom: 1px solid var(--border);
    }

    .item-list li:last-child {
      padding-bottom: 0;
      border-bottom: none;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      margin-bottom: 4px;
    }

    .badge.gold {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .item-heading {
      font-weight: 600;
      font-size: 0.96rem;
      display: block;
      margin-bottom: 3px;
    }

    .item-heading:hover {
      color: var(--accent);
      text-decoration: underline;
    }

    .item-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .bday-trivia {
      margin-top: 6px;
      font-size: 0.81rem;
      line-height: 1.42;
      color: var(--text);
      background: var(--surface-alt);
      padding: 6px 9px;
      border-radius: 7px;
      border-left: 2.5px solid var(--gold);
    }

    .wire-section {
      margin-bottom: 30px;
    }

    .wire-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .wire-header h2 {
      font-size: 1.75rem;
    }

    .wire-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
